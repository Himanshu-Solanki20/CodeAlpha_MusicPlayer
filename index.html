<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side A — Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Rubik:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="room">

    <section class="deck" aria-label="Music player">
      <div class="deck__top">
        <span class="deck__brand">SIDE&nbsp;A</span>
        <span class="deck__model">Stereo Cassette Deck · TD-77</span>
        <span class="led" id="led" title="Playing"></span>
      </div>

      <!-- cassette bay -->
      <div class="bay">
        <div class="cassette" id="cassette">
          <div class="cassette__label" id="label">
            <span class="cassette__side">A</span>
            <span class="cassette__title" id="labelTitle">—</span>
            <span class="cassette__stripes"></span>
          </div>

          <div class="cassette__window">
            <svg class="reels" viewBox="0 0 220 70" aria-hidden="true">
              <!-- tape running between the two packs -->
              <path id="tapePath" class="tape-run" d=""/>
              <circle id="packL" class="pack" cx="50" cy="35" r="30"/>
              <circle id="packR" class="pack" cx="170" cy="35" r="12"/>
              <g id="hubL" class="hub" transform="translate(50 35)">
                <circle r="10"/>
                <path d="M0-9v4M7.8 4.5l-3.5-2M-7.8 4.5l3.5-2"/>
              </g>
              <g id="hubR" class="hub" transform="translate(170 35)">
                <circle r="10"/>
                <path d="M0-9v4M7.8 4.5l-3.5-2M-7.8 4.5l3.5-2"/>
              </g>
            </svg>
          </div>

          <div class="cassette__bottom">
            <i></i><i></i><i></i><i></i>
          </div>
        </div>
      </div>

      <!-- now playing -->
      <div class="readout">
        <div class="readout__text">
          <h1 class="readout__title" id="title">Loading…</h1>
          <p class="readout__artist" id="artist">&nbsp;</p>
        </div>
        <div class="counter" aria-label="Elapsed time">
          <span id="elapsed">0:00</span>
          <span class="counter__sep">/</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="seek">
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <div class="seek__fill" id="seekFill"></div>
      </div>

      <!-- piano keys -->
      <div class="controls">
        <div class="keys">
          <button class="pkey" id="prevBtn" aria-label="Previous track" title="Previous (P)">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
          </button>
          <button class="pkey pkey--play" id="playBtn" aria-label="Play" title="Play / Pause (Space)">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
          </button>
          <button class="pkey" id="stopBtn" aria-label="Stop" title="Stop">
            <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
          </button>
          <button class="pkey" id="nextBtn" aria-label="Next track" title="Next (N)">
            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
          </button>
        </div>

        <div class="mixer">
          <div class="toggles">
            <button class="toggle" id="shuffleBtn" aria-pressed="false" title="Shuffle (S)">Shuffle</button>
            <button class="toggle" id="repeatBtn" data-mode="off" title="Repeat (R)">Repeat: off</button>
            <button class="toggle is-on" id="autoBtn" aria-pressed="true" title="Play the next track automatically">Autoplay</button>
          </div>
          <label class="volume">
            <button class="mute" id="muteBtn" aria-label="Mute" title="Mute (M)">
              <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave1" d="M16 9a4 4 0 0 1 0 6" fill="none"/><path class="wave2" d="M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none"/></svg>
            </button>
            <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume">
          </label>
        </div>
      </div>
    </section>

    <!-- J-card style playlist -->
    <aside class="jcard" aria-label="Playlist">
      <div class="jcard__spine">
        <span>Mixtape</span><span>Vol. 1</span>
      </div>
      <div class="jcard__body">
        <h2>Track listing</h2>
        <ol class="playlist" id="playlist"></ol>
        <p class="jcard__total" id="total"></p>
        <p class="jcard__credit">
          Music by T. Schürger — <a href="https://www.soundhelix.com" target="_blank" rel="noopener">SoundHelix</a>
        </p>
      </div>
    </aside>

  </main>

  <p class="shortcuts">
    <kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> seek 5s · <kbd>↑</kbd><kbd>↓</kbd> volume ·
    <kbd>N</kbd>/<kbd>P</kbd> next/prev · <kbd>M</kbd> mute
  </p>

  <audio id="audio" preload="metadata"></audio>

  <script src="script.js"></script>
</body>
</html>
